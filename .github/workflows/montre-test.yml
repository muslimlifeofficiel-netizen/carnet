name: App de test montre
on:
  push:
    paths: ["montre-test/**", ".github/workflows/montre-test.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Construire l'APK
        working-directory: montre-test
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Publier l'APK
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp montre-test/app/build/outputs/apk/debug/app-debug.apk test-montre-ml.apk
          gh release delete montre-test -y --cleanup-tag || true
          gh release create montre-test test-montre-ml.apk --title "Test montre ML" --notes "App de test : lecture Health Connect." --prerelease
