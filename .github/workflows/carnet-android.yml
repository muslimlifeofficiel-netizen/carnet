name: App Carnet Android
on:
  push:
    paths: ["app-android/**", ".github/workflows/carnet-android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Construire l'APK
        working-directory: app-android
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Publier l'APK
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp app-android/app/build/outputs/apk/debug/app-debug.apk carnet-ml.apk
          gh release delete carnet-android -y --cleanup-tag || true
          gh release create carnet-android carnet-ml.apk --title "Carnet Android" --notes "App Carnet : montre (Health Connect) et balance (Bluetooth) intégrées." --prerelease
